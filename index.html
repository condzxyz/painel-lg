<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Acesso restrito</title>
<style>
:root{--bg:#F5F3EC;--card:#FCFBF7;--ink:#151514;--muted:#6B6960;--line:#E2DFD3;--go:#151514;--go-ink:#F5F3EC;--err:#B4362A;--lime:#D6F24A;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#151514;--card:#1E1E1C;--ink:#F5F3EC;--muted:#A3A198;--line:#33322E;--go:#D6F24A;--go-ink:#151514;--err:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 28px 28px;display:flex;flex-direction:column;gap:12px}
.mark{display:flex;align-items:center;gap:10px;font:700 20px/1 var(--mono);letter-spacing:.03em}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1px rgba(21,21,20,.25)}
.mark span{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.04em}
h1{font-size:25px;line-height:1.15;letter-spacing:-.02em;margin:14px 0 0}
p{margin:0;color:var(--muted);font-size:15px}
label{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.field{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding-right:6px}
.field:focus-within{border-color:var(--ink)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 17px/1.2 var(--mono);letter-spacing:.06em;padding:13px 14px;outline:none}
#eye{border:0;background:transparent;color:var(--muted);font:500 13px/1 system-ui,sans-serif;padding:8px 10px;border-radius:8px;cursor:pointer}
#eye:hover{color:var(--ink)}
#msg{min-height:21px;color:var(--err);font-size:14px}
#go{border:0;border-radius:12px;background:var(--go);color:var(--go-ink);font:600 16px/1 system-ui,sans-serif;padding:15px 16px;cursor:pointer}
#go:hover{filter:brightness(1.08)}
#go[disabled]{opacity:.6;cursor:progress}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.no{animation:no .28s}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.card.no{animation:none}}
</style>
</head>
<body>
<form id="f" class="card" novalidate>
  <div class="mark"><i aria-hidden="true"></i>D0T1<span>powered by 3C</span></div>
  <h1>Painel de demonstração</h1>
  <p>Acesso restrito. Digite a senha que você recebeu.</p>
  <label for="pw">Senha</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
    <button type="button" id="eye" aria-pressed="false">Mostrar</button>
  </div>
  <div id="msg" role="alert"></div>
  <button id="go" type="submit">Entrar</button>
</form>

  var KEY='painel-chave';
  var $=function(id){return document.getElementById(id)};
  var b64=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  var hex=function(u){return Array.from(u,function(b){return b.toString(16).padStart(2,'0')}).join('')};
  var unhex=function(s){return new Uint8Array(s.match(/../g).map(function(h){return parseInt(h,16)}))};
  async function derive(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.s),iterations:P.n},base,256));
  }
  async function unlock(raw){
    var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    return new TextDecoder().decode(buf);
  }
  function show(html){ document.open(); document.write(html); document.close(); }
  var ok=!!(window.crypto&&crypto.subtle);
  if(!ok){ $('msg').textContent='Abra este endereço com https para entrar.'; $('go').disabled=true; return; }

  $('eye').addEventListener('click',function(){ var i=$('pw'), on=i.type==='password'; i.type=on?'text':'password'; this.textContent=on?'Ocultar':'Mostrar'; this.setAttribute('aria-pressed',String(on)); i.focus(); });

  $('f').addEventListener('submit',async function(e){ e.preventDefault();

    var go=$('go'); go.disabled=true; go.textContent='Abrindo…'; $('msg').textContent='';
    try{ var raw=await derive(pw); var html=await unlock(raw); try{sessionStorage.setItem(KEY,hex(raw))}catch(_){ } show(html); }
